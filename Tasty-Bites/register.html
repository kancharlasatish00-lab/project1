<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Tasty Bites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="index.html">🍕 Tasty Bites</a>
      <a class="back-link" href="index.html">← Back to Home</a>
    </nav>
  </header>
  <main class="auth-main">
    <form class="auth-card" id="registerForm">
      <div class="auth-emoji" aria-hidden="true">📝</div>
      <p class="eyebrow">JOIN OUR COMMUNITY</p>
      <h1>Create Account</h1>
      <p class="muted">Fill in the form to register.</p>
      <label for="registerName">Full name</label>
      <input id="registerName" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required>
      <label for="registerEmail">Email address</label>
      <input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="registerPhone">Phone number</label>
      <input id="registerPhone" name="phone" type="tel" autocomplete="tel" placeholder="Enter your phone number" required>
      <label for="registerPassword">Password</label>
      <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Enter password again" required>
      <label class="checkbox-label terms-label"><input id="terms" type="checkbox" required> I agree to the terms and conditions.</label>
      <button class="button full-width" type="submit">Register</button>
      <p class="form-message" id="registerStatus" role="status"></p>
      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
      <p class="demo-warning">Demo only: account details are not saved. Do not enter a real password.</p>
    </form>
  </main>
  <footer class="site-footer"><p>© 2026 Tasty Bites. Student project demo.</p></footer>
  <script src="script.js"></script>
</body>
</html>
